<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Dizzy House Studio | Catálogo</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
        body {
            background:#0a0a0a;
            color:#fff;
            font-family:'Roboto',sans-serif;
            min-height:100vh;
            min-height:100dvh;
            overflow-x:hidden;
            padding-bottom:max(40px,env(safe-area-inset-bottom));
        }

        /* === BACKGROUND === */
        .bg-wrapper { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; background:#050505; overflow:hidden; }
        .glow { position:absolute; border-radius:50%; filter:blur(80px); mix-blend-mode:screen; opacity:0.4; animation-timing-function:ease-in-out; animation-iteration-count:infinite; animation-direction:alternate; }
        .glow-1 { width:60vw; height:60vw; background:radial-gradient(circle,rgba(255,0,0,0.4) 0%,transparent 70%); top:-15%; left:-10%; animation:g1 12s infinite alternate; }
        .glow-2 { width:50vw; height:50vw; background:radial-gradient(circle,rgba(180,0,0,0.3) 0%,transparent 70%); bottom:-15%; right:-10%; animation:g2 15s infinite alternate; }
        @keyframes g1 { 0%{transform:translate(0,0)} 100%{transform:translate(15vw,20vh)} }
        @keyframes g2 { 0%{transform:translate(0,0)} 100%{transform:translate(-20vw,-15vh)} }

        /* === HEADER === */
        .cat-header {
            position:sticky; top:0; z-index:100;
            background:rgba(10,10,10,0.85);
            -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
            border-bottom:1px solid #1a1a1a;
            padding:16px 24px;
            display:flex; align-items:center; justify-content:space-between;
        }
        .btn-back {
            color:#666; text-decoration:none; font-size:0.85rem; letter-spacing:1px;
            display:flex; align-items:center; gap:6px; transition:color 0.2s;
            -webkit-appearance:none; background:none; border:none; cursor:pointer;
            font-family:inherit;
        }
        .btn-back:hover { color:#fff; }
        .btn-back svg { width:16px; height:16px; }
        .brand-mark {
            font-family:'Monument Extended',sans-serif;
            font-size:clamp(0.7rem,2vw,0.9rem);
            letter-spacing:4px; color:#fff;
            text-transform:uppercase;
        }
        .header-cart { color:#666; cursor:pointer; transition:color 0.2s; background:none; border:none; }
        .header-cart:hover { color:#ff0000; }

        /* === HERO === */
        .cat-hero {
            position:relative; z-index:1;
            padding:60px 24px 30px;
            text-align:left;
            max-width:1200px; margin:0 auto;
        }
        .cat-hero h1 {
            font-family:'Monument Extended',sans-serif;
            font-size:clamp(2.5rem,8vw,5rem);
            font-weight:900; letter-spacing:-1px;
            line-height:0.95; color:#fff;
            text-transform:uppercase;
            margin-bottom:12px;
        }
        .cat-hero h1 span { color:#ff0000; display:block; font-size:0.5em; letter-spacing:6px; margin-top:8px; }
        .cat-hero .tagline {
            color:#555; font-size:0.9rem; letter-spacing:3px;
            text-transform:uppercase; font-weight:300;
        }

        /* === FILTERS === */
        .filters-bar {
            position:relative; z-index:10;
            max-width:1200px; margin:0 auto;
            padding:0 24px 20px;
            display:flex; align-items:center; gap:12px;
            flex-wrap:wrap;
        }
        .filter-tabs {
            display:flex; gap:4px;
            background:#111; border-radius:8px; padding:4px;
            border:1px solid #1a1a1a;
        }
        .filter-tab {
            background:none; border:none; color:#555;
            font-family:'Roboto',sans-serif; font-size:0.85rem;
            padding:8px 18px; cursor:pointer; border-radius:6px;
            transition:all 0.2s; letter-spacing:0.5px;
            -webkit-appearance:none; text-transform:uppercase; font-weight:700;
        }
        .filter-tab:hover { color:#aaa; }
        .filter-tab.active { background:#fff; color:#000; }

        .search-box {
            margin-left:auto;
            position:relative;
        }
        .search-box input {
            background:#111; border:1px solid #1a1a1a;
            color:#fff; padding:8px 14px 8px 36px;
            border-radius:8px; font-size:0.85rem;
            width:180px; outline:none; transition:border-color 0.2s;
            font-family:inherit;
            -webkit-appearance:none;
        }
        .search-box input:focus { border-color:#333; }
        .search-box input::placeholder { color:#444; }
        .search-box svg {
            position:absolute; left:10px; top:50%; transform:translateY(-50%);
            width:16px; height:16px; stroke:#444;
        }

        /* === PRODUCT GRID === */
        .products-section {
            position:relative; z-index:1;
            max-width:1200px; margin:0 auto;
            padding:10px 24px 60px;
        }
        .products-count {
            color:#333; font-size:0.8rem; letter-spacing:2px;
            text-transform:uppercase; margin-bottom:20px;
        }
        .products-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:20px;
        }

        /* === PRODUCT CARD === */
        .product-card {
            background:#111;
            border:1px solid #1a1a1a;
            border-radius:14px;
            overflow:hidden;
            transition:all 0.35s cubic-bezier(0.25,1,0.5,1);
            cursor:pointer;
            position:relative;
        }
        .product-card:hover {
            transform:translateY(-6px);
            border-color:#333;
            box-shadow:0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,0,0,0.05);
        }
        .product-img {
            width:100%;
            aspect-ratio:1/1;
            overflow:hidden;
            background:#0d0d0d;
            position:relative;
        }
        .product-img img {
            width:100%; height:100%; object-fit:cover;
            transition:transform 0.5s cubic-bezier(0.25,1,0.5,1);
            display:block;
        }
        .product-card:hover .product-img img { transform:scale(1.06); }
        .product-badge {
            position:absolute; top:12px; left:12px;
            background:#ff0000; color:#fff;
            font-size:0.7rem; font-weight:700;
            padding:4px 10px; border-radius:4px;
            letter-spacing:1px; text-transform:uppercase;
        }
        .product-sizes {
            position:absolute; bottom:0; left:0; right:0;
            background:linear-gradient(transparent,rgba(0,0,0,0.9));
            padding:30px 14px 12px;
            display:flex; gap:6px; justify-content:center;
            opacity:0; transition:opacity 0.3s;
        }
        .product-card:hover .product-sizes { opacity:1; }
        .size-chip {
            background:rgba(255,255,255,0.1);
            -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
            color:#ccc; font-size:0.7rem; font-weight:700;
            padding:4px 8px; border-radius:4px;
            letter-spacing:0.5px;
        }
        .product-info { padding:16px 18px 20px; }
        .product-name {
            color:#ccc; font-size:0.95rem; font-weight:400;
            letter-spacing:0.5px; margin-bottom:6px;
            line-height:1.3;
        }
        .product-price {
            color:#fff; font-size:1.1rem; font-weight:700;
            letter-spacing:0.5px;
        }
        .product-price .old-price {
            color:#555; font-size:0.85rem;
            text-decoration:line-through;
            margin-left:8px; font-weight:400;
        }
        .product-cta {
            display:none;
            width:100%;
            background:#fff; color:#000;
            border:none; padding:12px;
            font-family:inherit; font-size:0.85rem;
            font-weight:700; letter-spacing:1px;
            text-transform:uppercase; cursor:pointer;
            transition:background 0.2s;
        }
        .product-card:hover .product-cta { display:block; }
        .product-cta:hover { background:#ff0000; color:#fff; }

        /* === EMPTY STATE === */
        .empty-state {
            grid-column:1/-1;
            text-align:center; padding:80px 20px;
            color:#333;
        }
        .empty-state p { font-size:1.1rem; letter-spacing:1px; }

        /* === FOOTER === */
        .cat-footer {
            position:relative; z-index:1;
            text-align:center; padding:40px 24px 20px;
            border-top:1px solid #111;
            max-width:1200px; margin:0 auto;
        }
        .cat-footer .social-row { display:flex; justify-content:center; gap:20px; margin-bottom:16px; }
        .cat-footer a { color:#444; transition:color 0.2s; text-decoration:none; }
        .cat-footer a:hover { color:#ff0000; }
        .cat-footer p { color:#333; font-size:0.75rem; letter-spacing:2px; text-transform:uppercase; }

        /* === MOBILE === */
        @media(max-width:600px) {
            .cat-header { padding:12px 16px; }
            .cat-hero { padding:40px 16px 20px; }
            .cat-hero h1 { font-size:2.8rem; }
            .filters-bar { padding:0 16px 16px; flex-direction:column; align-items:stretch; }
            .search-box { margin-left:0; }
            .search-box input { width:100%; }
            .products-section { padding:10px 16px 40px; }
            .products-grid { grid-template-columns:repeat(2,1fr); gap:12px; }
            .product-info { padding:10px 12px 14px; }
            .product-name { font-size:0.8rem; }
            .product-price { font-size:0.95rem; }
            .product-sizes { opacity:1; }
            .product-cta { display:block; }
        }
        @media(max-width:380px) {
            .products-grid { grid-template-columns:1fr; }
        }

        /* === FADE IN ANIMATION === */
        .product-card {
            animation:cardIn 0.5s ease both;
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-wrapper">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <!-- Header -->
    <header class="cat-header">
        <a href="index.html" class="btn-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            VOLTAR
        </a>
        <span class="brand-mark">Dizzy House</span>
        <button class="header-cart" aria-label="WhatsApp">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471.148-.67.445-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        </button>
    </header>

    <!-- Hero -->
    <section class="cat-hero">
        <h1>Catálogo<span>Dizzy House Clothing</span></h1>
        <p class="tagline">Streetwear · Old School · Exclusivo</p>
    </section>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-tabs" id="filter-tabs">
            <button class="filter-tab active" data-cat="all">Todos</button>
            <button class="filter-tab" data-cat="masculino">Masculino</button>
            <button class="filter-tab" data-cat="feminino">Feminino</button>
            <button class="filter-tab" data-cat="unissex">Unissex</button>
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Buscar...">
        </div>
    </div>

    <!-- Products -->
    <section class="products-section">
        <div class="products-count" id="products-count"></div>
        <div class="products-grid" id="products-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="cat-footer">
        <div class="social-row">
            <a href="https://www.instagram.com/tattoodoandre" target="_blank">Instagram</a>
            <a href="https://wa.me/5521976265417" target="_blank">WhatsApp</a>
        </div>
        <p>Dizzy House Studio &copy; 2026</p>
    </footer>

    <script>
    (function() {
        // === PRODUCT DATA ===
        const PRODUCTS = [
            { id:1, name:'Camiseta Skull & Roses', price:149.90, cat:'unissex', img:'img/products/tshirt_skull.png', sizes:['P','M','G','GG'], badge:null },
            { id:2, name:'Hoodie Dizzy Black', price:249.90, cat:'unissex', img:'img/products/hoodie_black.png', sizes:['M','G','GG'], badge:'NOVO' },
            { id:3, name:'Camiseta Old School Flash', price:139.90, cat:'masculino', img:'img/products/tshirt_oldschool.png', sizes:['P','M','G','GG'], badge:null },
            { id:4, name:'Cargo Pants Street', price:199.90, cat:'masculino', img:'img/products/cargo_pants.png', sizes:['38','40','42','44'], badge:null },
            { id:5, name:'Camiseta DIZZY Logo', price:129.90, cat:'unissex', img:'img/products/tshirt_dizzy.png', sizes:['P','M','G','GG','XG'], badge:'DESTAQUE' },
            { id:6, name:'Snapback Dizzy Red', price:89.90, cat:'unissex', img:'img/products/snapback.png', sizes:['Único'], badge:null },
            { id:7, name:'Camiseta Skull & Roses Fem', price:139.90, oldPrice:159.90, cat:'feminino', img:'img/products/tshirt_skull.png', sizes:['PP','P','M','G'], badge:'SALE' },
            { id:8, name:'Hoodie Dizzy Oversized', price:269.90, cat:'feminino', img:'img/products/hoodie_black.png', sizes:['P','M','G'], badge:'NOVO' },
            { id:9, name:'Camiseta Flash Art Fem', price:129.90, cat:'feminino', img:'img/products/tshirt_oldschool.png', sizes:['PP','P','M','G'], badge:null },
            { id:10, name:'Cargo Wide Leg', price:219.90, cat:'feminino', img:'img/products/cargo_pants.png', sizes:['36','38','40','42'], badge:null },
            { id:11, name:'Camiseta DIZZY Vintage Wash', price:159.90, cat:'masculino', img:'img/products/tshirt_dizzy.png', sizes:['M','G','GG','XG'], badge:null },
            { id:12, name:'Snapback Classic Black', price:79.90, oldPrice:99.90, cat:'masculino', img:'img/products/snapback.png', sizes:['Único'], badge:'SALE' },
        ];

        let currentCat = 'all';
        let searchTerm = '';

        // Read URL param
        const params = new URLSearchParams(window.location.search);
        const urlCat = params.get('cat');
        if (urlCat && ['masculino','feminino','unissex'].includes(urlCat)) {
            currentCat = urlCat;
        }

        const grid = document.getElementById('products-grid');
        const countEl = document.getElementById('products-count');
        const tabs = document.querySelectorAll('.filter-tab');
        const searchInput = document.getElementById('search-input');

        function formatPrice(v) {
            return 'R$ ' + v.toFixed(2).replace('.',',');
        }

        function filterProducts() {
            let items = PRODUCTS;
            if (currentCat !== 'all') items = items.filter(p => p.cat === currentCat);
            if (searchTerm) {
                const q = searchTerm.toLowerCase();
                items = items.filter(p => p.name.toLowerCase().includes(q));
            }
            return items;
        }

        function renderProducts() {
            const items = filterProducts();
            countEl.textContent = items.length + ' produto' + (items.length !== 1 ? 's' : '');

            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>Nenhum produto encontrado.</p></div>';
                return;
            }

            grid.innerHTML = '';
            items.forEach(function(p, i) {
                var card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = (i * 0.06) + 's';

                var badgeHtml = p.badge ? '<span class="product-badge">' + p.badge + '</span>' : '';
                var sizesHtml = p.sizes.map(function(s) { return '<span class="size-chip">' + s + '</span>'; }).join('');
                var oldPriceHtml = p.oldPrice ? '<span class="old-price">' + formatPrice(p.oldPrice) + '</span>' : '';

                card.innerHTML =
                    '<div class="product-img">' +
                        '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy">' +
                        badgeHtml +
                        '<div class="product-sizes">' + sizesHtml + '</div>' +
                    '</div>' +
                    '<div class="product-info">' +
                        '<div class="product-name">' + p.name + '</div>' +
                        '<div class="product-price">' + formatPrice(p.price) + oldPriceHtml + '</div>' +
                    '</div>' +
                    '<button class="product-cta" data-id="' + p.id + '">COMPRAR VIA WHATSAPP</button>';

                card.querySelector('.product-cta').addEventListener('click', function(e) {
                    e.stopPropagation();
                    var msg = 'Oi! Tenho interesse na peça: ' + p.name + ' (' + formatPrice(p.price) + ')';
                    window.open('https://wa.me/5521976265417?text=' + encodeURIComponent(msg), '_blank');
                });

                grid.appendChild(card);
            });
        }

        // Tab click
        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                currentCat = tab.dataset.cat;
                // Update URL without reload
                var newUrl = window.location.pathname + (currentCat !== 'all' ? '?cat=' + currentCat : '');
                history.replaceState(null, '', newUrl);
                renderProducts();
            });
        });

        // Set active tab from URL
        if (currentCat !== 'all') {
            tabs.forEach(function(t) {
                t.classList.remove('active');
                if (t.dataset.cat === currentCat) t.classList.add('active');
            });
        }

        // Search
        searchInput.addEventListener('input', function() {
            searchTerm = this.value.trim();
            renderProducts();
        });

        // WhatsApp header button
        document.querySelector('.header-cart').addEventListener('click', function() {
            window.open('https://wa.me/5521976265417?text=' + encodeURIComponent('Oi! Quero saber mais sobre as roupas Dizzy House!'), '_blank');
        });

        // Initial render
        renderProducts();
    })();
    </script>
</body>
</html>
