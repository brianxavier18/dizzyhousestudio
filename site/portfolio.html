<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.92, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Dizzy House Studio | Portfólio</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .portfolio-hero {
            text-align: center;
            padding: 60px 0 30px;
        }

        .portfolio-hero h1 {
            font-family: 'Monument Extended', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .portfolio-hero .subtitle {
            color: var(--neon-red);
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px 0;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            background: var(--item-bg, #1a1a1a);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            border-color: var(--neon-red, #ff0000);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2), 0 5px 15px rgba(0,0,0,0.5);
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            padding: 40px 20px 20px;
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .gallery-item:hover .overlay {
            transform: translateY(0);
        }

        .overlay .price {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-family: 'Monument Extended', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .overlay .desc {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Fallback info (always visible on mobile) */
        .gallery-info {
            padding: 16px 20px;
            border-top: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .gallery-info .price {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-family: 'Monument Extended', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.3;
        }

        .gallery-info .desc {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-top: 2px;
        }

        /* Empty state */
        .empty-gallery {
            text-align: center;
            padding: 80px 20px;
            color: #555;
        }

        .empty-gallery svg {
            width: 80px;
            height: 80px;
            stroke: #333;
            fill: none;
            stroke-width: 1;
            margin-bottom: 20px;
        }

        /* Back button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #888;
            text-decoration: none;
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 50px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .btn-back:hover {
            color: #fff;
            border-color: var(--neon-red, #ff0000);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        /* Loading animation */
        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: #555;
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid #333;
            border-top-color: var(--neon-red, #ff0000);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .portfolio-footer {
            text-align: center;
            padding: 40px 0 20px;
            border-top: 1px solid #222;
            margin-top: 60px;
        }

        .portfolio-footer .social-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
        }

        .portfolio-footer p {
            color: #555;
            font-size: 0.8rem;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                padding: 15px 0;
            }

            .gallery-item img {
                height: 250px;
            }

            .gallery-item .overlay {
                transform: translateY(0);
                position: relative;
                padding: 15px 20px;
                background: rgba(0,0,0,0.9);
            }

            .portfolio-hero {
                padding: 40px 0 20px;
            }

            .portfolio-hero h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
        }

        /* Desktop hover-only overlay */
        @media (hover: hover) {
            .gallery-info {
                display: none;
            }
        }

        /* Touch devices: show info, hide overlay */
        @media (hover: none) {
            .gallery-item .overlay {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="background-wrapper">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>

    <div class="container">
        <a href="home.html" class="btn-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Voltar
        </a>

        <div class="portfolio-hero">
            <h1>Portfólio</h1>
            <p class="subtitle">Trabalhos Realizados</p>
        </div>

        <div class="gallery-grid" id="gallery-grid">
            <div class="loading-spinner"></div>
        </div>

        <footer class="portfolio-footer">
            <div class="social-row">
                <!-- WhatsApp -->
                <a href="https://wa.me/5521976265417" target="_blank" class="social-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471.148-.67.445-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" fill="#ff0000"/>
                    </svg>
                </a>
                <!-- Instagram -->
                <a href="https://www.instagram.com/tattoodoandre?igsh=a2U3dWg0b2ZodG1v" target="_blank" class="social-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                </a>
            </div>
            <p>Dizzy House Studio &copy; 2026</p>
        </footer>
    </div>

    <!-- Lightbox Carousel -->
    <div id="portfolio-lightbox" class="lightbox-overlay">
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lb-close">✕</button>
            <div class="lightbox-image-wrapper">
                <span class="lightbox-counter" id="lb-counter">1 / 1</span>
                <button class="lightbox-nav lb-prev" id="lb-prev">&#10094;</button>
                <button class="lightbox-nav lb-next" id="lb-next">&#10095;</button>
                <div class="lightbox-track" id="lb-track"></div>
            </div>
            <div class="lightbox-info">
                <span class="lb-price" id="lb-price"></span>
                <span class="lb-desc" id="lb-desc"></span>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_URL = isLocal ? 'http://localhost:3001/api' : '/api';
        let allItems = [];

        async function loadPortfolio() {
            const grid = document.getElementById('gallery-grid');
            try {
                const res = await fetch(`${API_URL}/portfolio`);
                const items = await res.json();

                if (!Array.isArray(items) || items.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-gallery" style="grid-column: 1 / -1;">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <p>Nenhum trabalho cadastrado ainda.</p>
                        </div>`;
                    return;
                }

                allItems = items;
                grid.innerHTML = '';
                items.forEach(function(item, idx) {
                    const card = document.createElement('div');
                    card.className = 'gallery-item';
                    
                    const img = document.createElement('img');
                    img.src = item.url;
                    img.alt = item.desc || 'Trabalho Dizzy House Studio';
                    img.loading = 'lazy';
                    
                    const overlay = document.createElement('div');
                    overlay.className = 'overlay';
                    overlay.innerHTML = '<span class="price">' + (item.preco || '') + '</span><span class="desc">' + (item.desc || '') + '</span>';
                    
                    const info = document.createElement('div');
                    info.className = 'gallery-info';
                    info.innerHTML = '<span class="price">' + (item.preco || '') + '</span><span class="desc">' + (item.desc || '') + '</span>';
                    
                    card.appendChild(img);
                    card.appendChild(overlay);
                    card.appendChild(info);
                    card.addEventListener('click', function() { openLightbox(allItems, idx); });
                    grid.appendChild(card);
                });
            } catch(e) {
                console.error('Erro ao carregar portfólio:', e);
                grid.innerHTML = '<div style="color:#555; text-align:center; padding:40px; grid-column:1/-1;">Erro ao carregar portfólio.</div>';
            }
        }

        // === LIGHTBOX CAROUSEL ===
        var lbItems = [];
        var lbIndex = 0;
        var lbTouchStartX = 0;

        var lbOverlay = document.getElementById('portfolio-lightbox');
        var lbTrack = document.getElementById('lb-track');
        var lbCounter = document.getElementById('lb-counter');
        var lbPrice = document.getElementById('lb-price');
        var lbDesc = document.getElementById('lb-desc');
        var lbCloseBtn = document.getElementById('lb-close');
        var lbPrevBtn = document.getElementById('lb-prev');
        var lbNextBtn = document.getElementById('lb-next');
        var lbWrapper = lbOverlay ? lbOverlay.querySelector('.lightbox-image-wrapper') : null;

        function buildSlides(items) {
            lbTrack.innerHTML = '';
            items.forEach(function(item) {
                var slide = document.createElement('div');
                slide.className = 'lightbox-slide';
                var img = document.createElement('img');
                img.src = item.url;
                img.alt = item.desc || 'Dizzy House Studio';
                img.draggable = false;
                slide.appendChild(img);
                lbTrack.appendChild(slide);
            });
        }

        function updateLB() {
            lbTrack.style.transform = 'translateX(-' + (lbIndex * 100) + '%)';
            lbCounter.textContent = (lbIndex + 1) + ' / ' + lbItems.length;
            var item = lbItems[lbIndex];
            if (item) {
                lbPrice.textContent = item.preco || '';
                lbDesc.textContent = item.desc || '';
            }
            lbPrevBtn.style.opacity = lbIndex === 0 ? '0.3' : '1';
            lbPrevBtn.style.pointerEvents = lbIndex === 0 ? 'none' : 'auto';
            lbNextBtn.style.opacity = lbIndex === lbItems.length - 1 ? '0.3' : '1';
            lbNextBtn.style.pointerEvents = lbIndex === lbItems.length - 1 ? 'none' : 'auto';
        }

        window.openLightbox = function(items, startIdx) {
            lbItems = items;
            lbIndex = startIdx || 0;
            buildSlides(items);
            updateLB();
            lbOverlay.style.display = 'flex';
            lbOverlay.offsetHeight;
            lbOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        function closeLB() {
            lbOverlay.classList.remove('active');
            setTimeout(function() {
                lbOverlay.style.display = 'none';
                document.body.style.overflow = '';
            }, 350);
        }

        function lbPrev() { if (lbIndex > 0) { lbIndex--; updateLB(); } }
        function lbNext() { if (lbIndex < lbItems.length - 1) { lbIndex++; updateLB(); } }

        if (lbCloseBtn) lbCloseBtn.addEventListener('click', closeLB);
        if (lbPrevBtn) lbPrevBtn.addEventListener('click', lbPrev);
        if (lbNextBtn) lbNextBtn.addEventListener('click', lbNext);
        if (lbOverlay) lbOverlay.querySelector('.lightbox-backdrop').addEventListener('click', closeLB);

        document.addEventListener('keydown', function(e) {
            if (!lbOverlay || lbOverlay.style.display !== 'flex') return;
            if (e.key === 'Escape') closeLB();
            if (e.key === 'ArrowLeft') lbPrev();
            if (e.key === 'ArrowRight') lbNext();
        });

        if (lbWrapper) {
            lbWrapper.addEventListener('touchstart', function(e) {
                lbTouchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            lbWrapper.addEventListener('touchend', function(e) {
                var diff = e.changedTouches[0].screenX - lbTouchStartX;
                if (diff < -50) lbNext();
                else if (diff > 50) lbPrev();
            }, { passive: true });
        }

        loadPortfolio();
    })();
    </script>
</body>
</html>
